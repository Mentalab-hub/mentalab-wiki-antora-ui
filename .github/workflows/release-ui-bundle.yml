name: release-ui-bundle
on:
    push:
        branches: [main]
    workflow_dispatch:
permissions:
    contents: write
concurrency:
    group: release-ui-bundle
    cancel-in-progress: false
jobs:
    release:
        runs-on: [ubuntu-latest]
        steps:
            - name: "Checkout repository"
              uses: actions/checkout@v4
            - name: "Set up Node.js"
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - name: "Install dependencies"
              run: npm ci
            - name: "Build UI bundle"
              run: npx gulp bundle
              env:
                  CI: "true"
            - name: "Publish release"
              # The wiki playbook downloads releases/latest/download/ui-bundle.zip,
              # so each push to main becomes the new latest release.
              run: |
                  tag="ui-v${GITHUB_RUN_NUMBER}"
                  gh release create "$tag" build/ui-bundle.zip \
                      --title "UI bundle $tag" \
                      --notes "Built from ${GITHUB_SHA}" \
                      --target "${GITHUB_SHA}" \
                      --latest
              env:
                  GH_TOKEN: ${{ github.token }}
